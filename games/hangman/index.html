<body class="hangman-page">

    <header id="hm-hud">
        <div class="hm-hud-left">
            <a href="/" class="hud-btn back-btn" title="Back to Game Hub">🏠</a>

            <button class="hud-btn hm-reset-btn" id="hm-reset-btn" title="Reset game">🔄</button>
        </div>

    <section id="hm-game-area">
        <div class="hm-main-card">

                <div class="hm-word-head">

                <div class="hm-clue" id="hm-clue">💡 Clue: A fire-breathing creature that loves treasure</div>

            <div class="hm-status-card">
                <div class="hm-status-text" id="hm-status">Guess letters to save the hangman.</div>

            <div class="hm-difficulty" role="group" aria-label="Choose difficulty">
                <button class="hm-diff-btn" data-tier="easy" title="Short, easy words">🟢 Easy</button>
                <button class="hm-diff-btn active" data-tier="medium" title="Everyday words">🟡 Medium</button>
                <button class="hm-diff-btn" data-tier="hard" title="Long, tricky words">🔴 Hard</button>
            </div>
            <div class="hm-letters" id="hm-letters"></div>
            <div class="hm-stats-bar">
                <div class="hm-stat"><span class="hm-stat-label">Wins</span><span id="hm-wins">0</span></div>
                <div class="hm-stat"><span class="hm-stat-label">Losses</span><span id="hm-losses">0</span></div>
                <div class="hm-stat"><span class="hm-stat-label">Best</span><span id="hm-best">0</span></div>
            </div>
        </div>
